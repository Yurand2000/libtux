[package]
name = "libtux"
version = "0.1.1"
edition = "2024"

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
default = [
    "clock",
    "serde",
    "time_iterators",
]
clock = []
serde = ["dep:serde"]
time_extra = []
time_iterators = []
